{% extends "base.html" %}

{% block content %}
<h1 class="h4 mb-4">{{ title }}</h1>

{% if rows %}
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                {% for header in headers %}
                <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {% for row in rows %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="text-muted">Нет данных</p>
{% endif %}
{% endblock %}
