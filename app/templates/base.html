<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} — Финансовая отчётность интернет-заказов</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        :root {
            --brand: #4f46e5;
            --brand-hover: #4338ca;
            --brand-light: #6366f1;

            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-navbar: #1e293b;

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-on-dark: #f1f5f9;

            --border: #e2e8f0;
            --border-strong: #cbd5e1;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);
            --shadow-md: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
        }

        .navbar {
            background-color: var(--bg-navbar) !important;
            border-bottom: 1px solid #0f172a;
            padding: .75rem 0;
        }

        .brand-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-light), var(--brand));
            margin-right: 10px;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--text-on-dark) !important;
            letter-spacing: -0.01em;
            font-size: 1rem;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            font-size: .9rem;
            padding: .5rem 1rem !important;
            border-radius: 6px;
            transition: background-color .15s, color .15s;
        }

        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, .08);
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
        }

        .card-body {
            padding: 1rem;
        }

        .kpi-value {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-top: .25rem;
        }

        .card-title {
            font-size: .95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: .5rem;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        h1.h4 {
            font-weight: 600;
        }

        .table {
            color: var(--text-secondary);
            font-size: .9rem;
            --bs-table-bg: transparent;
        }

        .table thead th {
            background-color: #f8fafc;
            color: var(--text-primary);
            font-weight: 600;
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 2px solid var(--border);
            padding: .75rem;
        }

        .table tbody td {
            padding: .75rem;
            border-color: var(--border);
            vertical-align: middle;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f8fafc;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f5f9;
        }

        .user-badge {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 999px;
            padding: .4rem .9rem;
            font-size: .8rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        .btn-primary {
            background-color: var(--brand);
            border-color: var(--brand);
            font-weight: 500;
            font-size: .9rem;
            padding: .45rem 1rem;
        }

        .btn-primary:hover {
            background-color: var(--brand-hover);
            border-color: var(--brand-hover);
        }

        .btn-outline-secondary {
            color: #585c62;
            border-color: rgba(255, 255, 255, .15);
            font-size: .85rem;
        }

        .btn-outline-secondary:hover {
            background-color: rgba(255, 255, 255, .08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, .25);
        }

        .form-control, .form-select {
            background-color: #ffffff;
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            font-size: .9rem;
            padding: .5rem .75rem;
            border-radius: 6px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--brand);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: .85rem;
            margin-bottom: .4rem;
        }

        .list-group-item {
            background-color: var(--bg-card);
            border-color: var(--border);
            color: var(--text-secondary);
            font-size: .9rem;
            padding: .75rem 20px;
        }

        .list-group-item-action:hover {
            background-color: #f8fafc;
            color: var(--brand);
        }

        a {
            color: var(--brand);
            text-decoration: none;
        }

        a:hover {
            color: var(--brand-hover);
        }

        .badge {
            font-weight: 500;
            font-size: .75rem;
            padding: .35em .65em;
            letter-spacing: 0.01em;
        }

        .alert-danger {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .page-header-subtitle {
            color: var(--text-muted);
            font-size: .85rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">
            <span class="brand-dot"></span>Финансовая отчётность интернет-заказов
        </a>

        <div class="collapse navbar-collapse">
            {% if user %}
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Дашборд</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/orders">Заказы</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/reports">Отчёты</a>
                </li>

                {% if user.role == 'admin' %}
                <li class="nav-item">
                    <a class="nav-link" href="/users">Пользователи</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/audit">Аудит</a>
                </li>
                {% endif %}
            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="user-badge">
                    {{ user.username }} · {{ role_label }}
                </span>

                <form method="post" action="/logout" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                        Выйти
                    </button>
                </form>
            </div>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
